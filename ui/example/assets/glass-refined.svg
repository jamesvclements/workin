<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<title>Glass study: refined interaction</title>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e1e1e1" stroke-width=".6"/></pattern>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".25" stop-color="#fff" stop-opacity=".1"/><stop offset=".55" stop-color="#767676" stop-opacity=".45"/><stop offset=".72" stop-color="#fff"/><stop offset="1" stop-color="#7a7a7a" stop-opacity=".25"/></linearGradient>
  <radialGradient id="glass" cx=".35" cy=".25" r=".8"><stop stop-color="#fff" stop-opacity=".28"/><stop offset=".68" stop-color="#fff" stop-opacity=".02"/><stop offset=".94" stop-color="#a1a1a1" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity=".75"/></radialGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#2e2e2e" flood-opacity=".12"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="1.6"/></filter>
  <filter id="refraction"><feTurbulence type="fractalNoise" baseFrequency=".008" numOctaves="1" seed="4" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G"/></filter>
  <clipPath id="lens-clip"><circle id="clip-circle" cx="640" cy="410" r="146"/></clipPath>
  <g id="composition">
    <rect width="1200" height="800" fill="#f4f4f4"/>
    <rect width="1200" height="800" fill="url(#grid)"/>
    <rect x="80" width="1" height="800" fill="#dbdbdb"/><rect x="1120" width="1" height="800" fill="#dbdbdb"/>
    <path d="M80 152H1120M80 650H1120" stroke="#d6d6d6"/>
    <g fill="#777777" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.8"><text x="104" y="116">FIELDWORK</text><text x="1096" y="116" text-anchor="end">INTERACTION STUDIES / 001</text></g>
    <g fill="#242424" font-family="Helvetica Neue, Arial, sans-serif" font-size="116" font-weight="500" letter-spacing="-7"><text x="128" y="330">A different</text><text x="128" y="447">perspective.</text></g>
    <g fill="#757575" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" letter-spacing="-.4">
    <text x="135" y="520" filter="url(#soft)">Move the glass. Change what you see.</text>
    </g>
    <g font-family="Arial, sans-serif" font-size="12" fill="#848484"><text x="104" y="690">001 — Refraction</text><text x="1096" y="690" text-anchor="end">Click, drag, release</text></g>
    <circle cx="1089" cy="744" r="4" fill="#7a7a7a"/>
  </g>
</defs>
<use href="#composition"/>
<g id="lens-shadow" transform="translate(640 410)"><circle r="150" fill="#f4f4f4" filter="url(#shadow)"/></g>
<g clip-path="url(#lens-clip)"><g id="reflected" transform="translate(-140.8 -90.2) scale(1.22)" filter="url(#refraction)"><use href="#composition"/></g></g>
<g id="lens" transform="translate(640 410)">
  <circle r="150" fill="url(#glass)" stroke="url(#edge)" stroke-width="3"/>
  <circle r="143" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="1"/>
  <path d="M-100.5 -90.0 A135.0 135.0 0 0 1 52.5 -127.5" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
</g>
</svg>